apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-event-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smart-event-backend
  template:
    metadata:
      labels:
        app: smart-event-backend
    spec:
      containers:
      - name: backend
        image: smart-event-backend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: smart-event-backend-service
spec:
  type: NodePort
  selector:
    app: smart-event-backend
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30050
