apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-event-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smart-event-frontend
  template:
    metadata:
      labels:
        app: smart-event-frontend
    spec:
      containers:
      - name: frontend
        image: smart-event-frontend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: smart-event-frontend-service
spec:
  type: NodePort
  selector:
    app: smart-event-frontend
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30090
